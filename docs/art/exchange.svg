<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="744" viewBox="0 0 1280 744" role="img" aria-label="One Octet connection carrying three requests, an unknown frame and a malformed frame">
<title>One Octet connection carrying three requests, an unknown frame and a malformed frame</title><desc>A client and server share one TCP connection. The client fetches /hello.txt and gets RESPONSE 200 then DATA with END. An unknown frame type 0x7f is skipped. /nope returns 404 on the same connection. A frame with version 2 gets 400 and the server closes.</desc>
